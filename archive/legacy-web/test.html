<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运占卜 - 验证测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 16px;
            font-size: 1.3em;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #555;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-chinese {
            background: linear-gradient(135deg, #d31027 0%, #ea384d 100%);
            color: white;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .result p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .result .label {
            font-weight: 600;
            color: #333;
        }
        .error {
            color: #d31027;
            margin-top: 10px;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 8px;
        }
        .success {
            color: #27ae60;
            margin-top: 10px;
            padding: 10px;
            background: #e8f8f0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>命运占卜 - 核心引擎验证</h1>

        <!-- 八字算命测试 -->
        <div class="card">
            <h2>八字算命测试</h2>
            <div class="form-group">
                <label>出生年份</label>
                <input type="number" id="bazi-year" placeholder="例如：1990" value="1990">
            </div>
            <div class="form-group">
                <label>出生月份</label>
                <input type="number" id="bazi-month" placeholder="1-12" value="5">
            </div>
            <div class="form-group">
                <label>出生日期</label>
                <input type="number" id="bazi-day" placeholder="1-31" value="15">
            </div>
            <div class="form-group">
                <label>出生时辰</label>
                <select id="bazi-hour">
                    <option value="0">子时 (23:00-01:00)</option>
                    <option value="1">丑时 (01:00-03:00)</option>
                    <option value="2">寅时 (03:00-05:00)</option>
                    <option value="3">卯时 (05:00-07:00)</option>
                    <option value="4">辰时 (07:00-09:00)</option>
                    <option value="5" selected>巳时 (09:00-11:00)</option>
                    <option value="6">午时 (11:00-13:00)</option>
                    <option value="7">未时 (13:00-15:00)</option>
                    <option value="8">申时 (15:00-17:00)</option>
                    <option value="9">酉时 (17:00-19:00)</option>
                    <option value="10">戌时 (19:00-21:00)</option>
                    <option value="11">亥时 (21:00-23:00)</option>
                </select>
            </div>
            <div class="form-group">
                <label>性别</label>
                <select id="bazi-gender">
                    <option value="男" selected>男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <button class="btn btn-chinese" onclick="testBazi()">测试八字计算</button>
            <div id="bazi-result"></div>
        </div>

        <!-- 六爻测试 -->
        <div class="card">
            <h2>周易六爻测试</h2>
            <div class="form-group">
                <label>您的问题</label>
                <input type="text" id="liuyao-question" placeholder="请输入您想咨询的问题" value="问事业发展">
            </div>
            <div class="form-group">
                <label>性别</label>
                <select id="liuyao-gender">
                    <option value="男" selected>男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <button class="btn btn-chinese" onclick="testLiuyao()">测试六爻占卜</button>
            <div id="liuyao-result"></div>
        </div>

        <!-- 塔罗测试 -->
        <div class="card">
            <h2>塔罗占卜测试</h2>
            <div class="form-group">
                <label>您的问题</label>
                <input type="text" id="tarot-question" placeholder="请输入您想咨询的问题" value="问感情发展">
            </div>
            <div class="form-group">
                <label>牌阵</label>
                <select id="tarot-spread">
                    <option value="三牌阵" selected>三牌阵</option>
                    <option value="凯尔特十字">凯尔特十字</option>
                    <option value="关系牌阵">关系牌阵</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="testTarot()">测试塔罗占卜</button>
            <div id="tarot-result"></div>
        </div>

        <!-- 星盘测试 -->
        <div class="card">
            <h2>星盘解析测试</h2>
            <div class="form-group">
                <label>出生年份</label>
                <input type="number" id="astro-year" placeholder="例如：1990" value="1990">
            </div>
            <div class="form-group">
                <label>出生月份</label>
                <input type="number" id="astro-month" placeholder="1-12" value="5">
            </div>
            <div class="form-group">
                <label>出生日期</label>
                <input type="number" id="astro-day" placeholder="1-31" value="15">
            </div>
            <div class="form-group">
                <label>出生小时 (0-23)</label>
                <input type="number" id="astro-hour" placeholder="0-23" value="14">
            </div>
            <div class="form-group">
                <label>出生地点</label>
                <input type="text" id="astro-location" placeholder="例如：北京" value="北京">
            </div>
            <button class="btn btn-primary" onclick="testAstro()">测试星盘计算</button>
            <div id="astro-result"></div>
        </div>
    </div>

    <script>
        // 数据层数据（内联版本，用于HTML测试）
        const TIAN_GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const DI_ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        const TIAN_GAN_WUXING = { '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土', '己': '土', '庚': '金', '辛': '金', '壬': '水', '癸': '水' };
        const DI_ZHI_WUXING = { '子': '水', '丑': '土', '寅': '木', '卯': '木', '辰': '土', '巳': '火', '午': '火', '未': '土', '申': '金', '酉': '金', '戌': '土', '亥': '水' };
        const SHI_CHEN = [
            { name: '子时', time: '23:00-01:00', diZhi: '子' }, { name: '丑时', time: '01:00-03:00', diZhi: '丑' },
            { name: '寅时', time: '03:00-05:00', diZhi: '寅' }, { name: '卯时', time: '05:00-07:00', diZhi: '卯' },
            { name: '辰时', time: '07:00-09:00', diZhi: '辰' }, { name: '巳时', time: '09:00-11:00', diZhi: '巳' },
            { name: '午时', time: '11:00-13:00', diZhi: '午' }, { name: '未时', time: '13:00-15:00', diZhi: '未' },
            { name: '申时', time: '15:00-17:00', diZhi: '申' }, { name: '酉时', time: '17:00-19:00', diZhi: '酉' },
            { name: '戌时', time: '19:00-21:00', diZhi: '戌' }, { name: '亥时', time: '21:00-23:00', diZhi: '亥' }
        ];
        const MONTH_GAN_TABLE = { '甲': 2, '己': 2, '乙': 4, '庚': 4, '丙': 6, '辛': 6, '丁': 8, '壬': 8, '戊': 0, '癸': 0 };
        const HOUR_GAN_TABLE = { '甲': 0, '己': 0, '乙': 2, '庚': 2, '丙': 4, '辛': 4, '丁': 6, '壬': 6, '戊': 8, '癸': 8 };

        // 核心层 - 八字引擎
        const BaziEngine = {
            calcYearPillar(year) {
                const ganIndex = (year - 1900 + 6) % 10;
                const zhiIndex = (year - 1900 + 0) % 12;
                const gan = TIAN_GAN[ganIndex];
                const zhi = DI_ZHI[zhiIndex];
                return { gan, zhi, ganWuxing: TIAN_GAN_WUXING[gan], zhiWuxing: DI_ZHI_WUXING[zhi] };
            },
            calcMonthPillar(year, month) {
                const yearPillar = this.calcYearPillar(year);
                const monthGanStart = MONTH_GAN_TABLE[yearPillar.gan];
                const monthGanIndex = (monthGanStart + month - 1) % 10;
                const monthZhiIndex = (month + 1) % 12;
                const gan = TIAN_GAN[monthGanIndex];
                const zhi = DI_ZHI[monthZhiIndex];
                return { gan, zhi, ganWuxing: TIAN_GAN_WUXING[gan], zhiWuxing: DI_ZHI_WUXING[zhi] };
            },
            calcDayPillar(year, month, day) {
                const baseDate = new Date(1900, 0, 31);
                const targetDate = new Date(year, month - 1, day);
                const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
                const ganIndex = ((diffDays % 10) + 10) % 10;
                const zhiIndex = ((diffDays % 12) + 12) % 12;
                const gan = TIAN_GAN[ganIndex];
                const zhi = DI_ZHI[zhiIndex];
                return { gan, zhi, ganWuxing: TIAN_GAN_WUXING[gan], zhiWuxing: DI_ZHI_WUXING[zhi] };
            },
            calcHourPillar(dayPillar, hourIndex) {
                const hourGanStart = HOUR_GAN_TABLE[dayPillar.gan];
                const hourGanIndex = (hourGanStart + hourIndex) % 10;
                const zhi = DI_ZHI[hourIndex];
                const gan = TIAN_GAN[hourGanIndex];
                return { gan, zhi, ganWuxing: TIAN_GAN_WUXING[gan], zhiWuxing: DI_ZHI_WUXING[zhi] };
            },
            generateReport(year, month, day, hourIndex, gender) {
                const yearPillar = this.calcYearPillar(year);
                const monthPillar = this.calcMonthPillar(year, month);
                const dayPillar = this.calcDayPillar(year, month, day);
                const hourPillar = this.calcHourPillar(dayPillar, hourIndex);
                const bazi = `${yearPillar.gan}${yearPillar.zhi} ${monthPillar.gan}${monthPillar.zhi} ${dayPillar.gan}${dayPillar.zhi} ${hourPillar.gan}${hourPillar.zhi}`;
                
                return {
                    birthInfo: `${year}年${month}月${day}日 ${SHI_CHEN[hourIndex].name}`,
                    gender, bazi,
                    yearPillar: `${yearPillar.gan}${yearPillar.zhi}`,
                    monthPillar: `${monthPillar.gan}${monthPillar.zhi}`,
                    dayPillar: `${dayPillar.gan}${dayPillar.zhi}`,
                    hourPillar: `${hourPillar.gan}${hourPillar.zhi}`,
                    analysis: '您的八字显示为人聪明伶俐，做事有计划，财运较好。',
                    suggestion: '保持乐观心态，多与他人交流，抓住机会发展事业。'
                };
            }
        };

        // 核心层 - 六爻引擎
        const LiuyaoEngine = {
            divinate(question, gender, date) {
                const guaNames = ['乾卦', '坤卦', '屯卦', '蒙卦', '需卦', '讼卦', '师卦', '比卦', '小畜卦', '履卦',
                    '泰卦', '否卦', '同人卦', '大有卦', '谦卦', '豫卦', '随卦', '蛊卦', '临卦', '观卦',
                    '噬嗑卦', '贲卦', '剥卦', '复卦', '无妄卦', '大畜卦', '颐卦', '大过卦', '坎卦', '离卦',
                    '咸卦', '恒卦', '遁卦', '大壮卦', '晋卦', '明夷卦', '家人卦', '睽卦', '蹇卦', '解卦',
                    '损卦', '益卦', '夬卦', '姤卦', '萃卦', '升卦', '困卦', '井卦', '革卦', '鼎卦',
                    '震卦', '艮卦', '渐卦', '归妹卦', '丰卦', '旅卦', '巽卦', '兑卦', '涣卦', '节卦',
                    '中孚卦', '小过卦', '既济卦', '未济卦'];
                const randomGua = guaNames[Math.floor(Math.random() * guaNames.length)];
                const fortunes = ['大吉', '吉', '中平', '小吉', '小凶', '凶'];
                const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                
                return {
                    question, gender, date,
                    hexagram: randomGua,
                    fortune,
                    analysis: `${randomGua}象征天，刚健中正，您的问题将会得到积极的解决。`,
                    suggestion: '勇往直前，积极行动，抓住机会，成功在望。'
                };
            }
        };

        // 核心层 - 塔罗引擎
        const TarotEngine = {
            divinate(question, spread, gender) {
                const majorArcana = ['愚者', '魔术师', '女祭司', '皇后', '皇帝', '教皇', '恋人', '战车', '力量', '隐者',
                    '命运之轮', '正义', '倒吊人', '死神', '节制', '恶魔', '塔', '星星', '月亮', '太阳', '审判', '世界'];
                
                const cardCount = spread === '三牌阵' ? 3 : (spread === '凯尔特十字' ? 10 : 5);
                const cards = [];
                for (let i = 0; i < cardCount; i++) {
                    cards.push(majorArcana[Math.floor(Math.random() * majorArcana.length)]);
                }
                
                return {
                    question, spread, gender,
                    cards: cards.join('、'),
                    analysis: '塔罗牌揭示了您内心深处的能量和潜力。',
                    suggestion: '相信自己的能力，保持平衡的心态，勇敢地追求您的梦想。'
                };
            }
        };

        // 核心层 - 星盘引擎
        const AstroEngine = {
            calcSunSign(month, day) {
                const signs = ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座', '天秤座', '天蝎座', '射手座', '摩羯座', '水瓶座', '双鱼座'];
                const days = [21, 20, 21, 22, 23, 23, 23, 24, 23, 22, 20, 19];
                let index = month - 1;
                if (day < days[index]) {
                    index = (index - 1 + 12) % 12;
                }
                return signs[index];
            },
            generateReport(year, month, day, hour, location) {
                const sunSign = this.calcSunSign(month, day);
                const moonSigns = ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座', '天秤座', '天蝎座', '射手座', '摩羯座', '水瓶座', '双鱼座'];
                const moonSign = moonSigns[(year + month + day + hour) % 12];
                const ascendants = ['白羊座', '金牛座', '双子座', '巨蟹座', '狮子座', '处女座', '天秤座', '天蝎座', '射手座', '摩羯座', '水瓶座', '双鱼座'];
                const ascendant = ascendants[(year + month + day + hour + location.length) % 12];
                
                return {
                    birthInfo: `${year}年${month}月${day}日 ${hour}:00 ${location}`,
                    sunSign, moonSign, ascendant,
                    analysis: `您具有${sunSign}的活力和领导力，月亮${moonSign}赋予您深刻的情感，上升${ascendant}让您充满自信。`,
                    suggestion: '发挥您的领导才能，保持积极的心态面对挑战。'
                };
            }
        };

        // 测试函数
        function testBazi() {
            try {
                const year = parseInt(document.getElementById('bazi-year').value);
                const month = parseInt(document.getElementById('bazi-month').value);
                const day = parseInt(document.getElementById('bazi-day').value);
                const hour = parseInt(document.getElementById('bazi-hour').value);
                const gender = document.getElementById('bazi-gender').value;
                
                const result = BaziEngine.generateReport(year, month, day, hour, gender);
                
                document.getElementById('bazi-result').innerHTML = `
                    <div class="result">
                        <h3>八字计算结果</h3>
                        <p><span class="label">出生信息：</span>${result.birthInfo}</p>
                        <p><span class="label">八字：</span>${result.bazi}</p>
                        <p><span class="label">年柱：</span>${result.yearPillar}</p>
                        <p><span class="label">月柱：</span>${result.monthPillar}</p>
                        <p><span class="label">日柱：</span>${result.dayPillar}</p>
                        <p><span class="label">时柱：</span>${result.hourPillar}</p>
                        <p><span class="label">分析：</span>${result.analysis}</p>
                        <p><span class="label">建议：</span>${result.suggestion}</p>
                    </div>
                `;
            } catch (e) {
                document.getElementById('bazi-result').innerHTML = `<div class="error">错误：${e.message}</div>`;
            }
        }

        function testLiuyao() {
            try {
                const question = document.getElementById('liuyao-question').value;
                const gender = document.getElementById('liuyao-gender').value;
                const date = new Date().toISOString().split('T')[0];
                
                const result = LiuyaoEngine.divinate(question, gender, date);
                
                document.getElementById('liuyao-result').innerHTML = `
                    <div class="result">
                        <h3>六爻占卜结果</h3>
                        <p><span class="label">问题：</span>${result.question}</p>
                        <p><span class="label">卦象：</span>${result.hexagram}</p>
                        <p><span class="label">吉凶：</span>${result.fortune}</p>
                        <p><span class="label">解读：</span>${result.analysis}</p>
                        <p><span class="label">建议：</span>${result.suggestion}</p>
                    </div>
                `;
            } catch (e) {
                document.getElementById('liuyao-result').innerHTML = `<div class="error">错误：${e.message}</div>`;
            }
        }

        function testTarot() {
            try {
                const question = document.getElementById('tarot-question').value;
                const spread = document.getElementById('tarot-spread').value;
                const gender = '女';
                
                const result = TarotEngine.divinate(question, spread, gender);
                
                document.getElementById('tarot-result').innerHTML = `
                    <div class="result">
                        <h3>塔罗占卜结果</h3>
                        <p><span class="label">问题：</span>${result.question}</p>
                        <p><span class="label">牌阵：</span>${result.spread}</p>
                        <p><span class="label">牌面：</span>${result.cards}</p>
                        <p><span class="label">解读：</span>${result.analysis}</p>
                        <p><span class="label">建议：</span>${result.suggestion}</p>
                    </div>
                `;
            } catch (e) {
                document.getElementById('tarot-result').innerHTML = `<div class="error">错误：${e.message}</div>`;
            }
        }

        function testAstro() {
            try {
                const year = parseInt(document.getElementById('astro-year').value);
                const month = parseInt(document.getElementById('astro-month').value);
                const day = parseInt(document.getElementById('astro-day').value);
                const hour = parseInt(document.getElementById('astro-hour').value);
                const location = document.getElementById('astro-location').value;
                
                const result = AstroEngine.generateReport(year, month, day, hour, location);
                
                document.getElementById('astro-result').innerHTML = `
                    <div class="result">
                        <h3>星盘解析结果</h3>
                        <p><span class="label">出生信息：</span>${result.birthInfo}</p>
                        <p><span class="label">太阳星座：</span>${result.sunSign}</p>
                        <p><span class="label">月亮星座：</span>${result.moonSign}</p>
                        <p><span class="label">上升星座：</span>${result.ascendant}</p>
                        <p><span class="label">解读：</span>${result.analysis}</p>
                        <p><span class="label">建议：</span>${result.suggestion}</p>
                    </div>
                `;
            } catch (e) {
                document.getElementById('astro-result').innerHTML = `<div class="error">错误：${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
